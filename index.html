<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unity Guide - Game Mode</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Fredoka',sans-serif;
  background:linear-gradient(#4ec7ff,#87f56b);
  min-height:100vh;
  color:#1b1b1b;
  /* Variables pour le contenu pédagogique */
  --color-info: #0C447C;
  --bg-info: #E6F1FB;
  --color-warn: #854F0B;
  --bg-warn: #FAEEDA;
  --color-success: #0F6E56;
  --bg-success: #E1F5EE;
  --color-code-bg: #2C2C2A;
  --color-code-text: #D3D1C7;
}
.container{max-width:950px;margin:auto;padding:20px}

/* HUD */
.hud{
  background:#fff;border-radius:20px;padding:15px 20px;margin-bottom:15px;
  display:flex;justify-content:space-between;align-items:center;
  box-shadow:0 8px 0 #c9c9c9;
}
.title{font-family:'Press Start 2P';font-size:14px}
.hearts{font-size:22px}
.xpbar{height:12px;background:#eee;border-radius:20px;overflow:hidden;width:200px}
.xp{height:100%;background:linear-gradient(90deg,#ffd93d,#ff7a00)}

.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}
.tab{
 background:#fff;padding:10px 18px;border-radius:14px;
 box-shadow:0 6px 0 #c9c9c9;cursor:pointer;font-weight:600
}
.tab.active{background:#ff6b6b;color:#fff;box-shadow:0 6px 0 #c94a4a}

.card{
 background:#fff;border-radius:20px;padding:20px;margin-top:10px;
 box-shadow:0 10px 0 #c9c9c9;
}
.stepTitle{font-family:'Press Start 2P';font-size:13px;margin-bottom:10px}
.stepSubtitle{font-size:16px; font-weight:600; color:#666; margin-bottom:15px; display:block;}

/* Styles pédagogiques adaptés */
.tip-box, .warn-box, .success-box {
  padding: 15px; border-radius: 12px; margin: 15px 0; font-size: 14px; border-left: 6px solid;
}
.tip-box { background: var(--bg-info); color: var(--color-info); border-color: var(--color-info); }
.warn-box { background: var(--bg-warn); color: var(--color-warn); border-color: var(--color-warn); }
.success-box { background: var(--bg-success); color: var(--color-success); border-color: var(--color-success); }

.code-block {
  background: var(--color-code-bg); color: var(--color-code-text);
  padding: 15px; border-radius: 12px; font-family: 'Courier New', monospace;
  font-size: 13px; margin: 15px 0; overflow-x: auto; white-space: pre; line-height: 1.5;
  box-shadow: inset 0 4px 8px rgba(0,0,0,0.3);
}
.code-keyword { color: #85B7EB; }
.code-comment { color: #6A9955; }
.code-string { color: #CE9178; }

.steps-list { list-style: none; margin: 15px 0; }
.steps-list li { display: flex; gap: 12px; align-items: flex-start; padding: 8px 0; font-size: 14px; }
.steps-list .num { 
  width: 24px; height: 24px; border-radius: 50%; background: #ff6b6b; color: #fff; 
  display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; flex-shrink: 0;
}

.ui-mock { background: #333; border-radius: 10px; padding: 12px; color: #eee; margin: 10px 0; font-family: monospace; font-size: 12px; }
.feature-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
.feature-card { background: #f9f9f9; padding: 10px; border-radius: 10px; border: 1px solid #ddd; }
.feature-card span { display: block; font-size: 11px; color: #888; }
.visual-diagram { background: #fff; border: 2px solid #eee; border-radius: 15px; padding: 10px; margin: 15px 0; }

.nav{display:flex;justify-content:space-between;margin-top:20px}
.btn{
 background:#ffd93d;border:none;padding:12px 18px;border-radius:14px;
 box-shadow:0 6px 0 #c9a600;font-weight:600;cursor:pointer
}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c9a600}
.btn:disabled{background:#e0e0e0; box-shadow:0 6px 0 #bdbdbd; cursor:not-allowed;}

.star{font-size:22px}
.center{text-align:center;margin-top:10px}
.explain { font-size: 15px; line-height: 1.6; margin-bottom: 10px; }
.bold { font-weight: 600; color: #000; }
</style>
</head>
<body>

<div class="container">

<div class="hud">
  <div class="title">UNITY QUEST BY BABLY </div>
  <div class="hearts" id="hearts">❤️❤️❤️</div>
  <div class="xpbar"><div class="xp" id="xp"></div></div>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchGame('install')">⚙️ Installation</div>
  <div class="tab" onclick="switchGame('flappy')">🐦 Flappy Bird</div>
  <div class="tab" onclick="switchGame('snake')">Snake</div>
  <div class="tab" onclick="switchGame('bounce')">Bounce</div>
</div>

<div class="card">
  <div class="stepTitle" id="title"></div>
  <div id="content"></div>
  <div class="center star" id="reward"></div>

  <div class="nav">
    <button class="btn" id="btnPrev" onclick="prevStep()">⬅ Etape précédente</button>
    <button class="btn" id="btnNext" onclick="nextStep()">Etape suivante ➡</button>
  </div>
</div>

</div>

// Affiche la fenêtre pop-up de bienvenue au chargement de la page
alert("Bienvenue dans l'univert de Bably. Es-tu prêt à te lancer dans cette aventure excitante ?");
function save(){ localStorage.setItem('unityProgress',JSON.stringify(progress)) }

function updateHUD(){
 document.getElementById('xp').style.width=progress.xp+'%'
 document.getElementById('hearts').innerText='❤️'.repeat(progress.life)
}

function render(){
 const list = games[progress.game];
 const data = list[progress.step];
 
 document.getElementById('title').innerText = data.title;
 document.getElementById('content').innerHTML = `
    <span class="stepSubtitle">${data.subtitle}</span>
    ${data.content}
 `;
 document.getElementById('reward').innerText = '⭐'.repeat(progress.step+1);
 
 document.getElementById('btnPrev').disabled = (progress.step === 0);
 document.getElementById('btnNext').innerText = (progress.step === list.length - 1) ? "Mission accomplie ! 🎉" : "Etape suivante ➡";

 updateHUD();save();
 window.scrollTo(0,0);
}

function nextStep(){
 const list=games[progress.game]
 if(progress.step<list.length-1){
   progress.step++;
   progress.xp+=5;
   if(progress.xp>100)progress.xp=100;
 }
 render();
}

function prevStep(){
 if(progress.step>0)progress.step--;
 render();
}

function switchGame(g){
 progress.game=g;progress.step=0;
 document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
 event.target.classList.add('active');
 render();
}

render();
