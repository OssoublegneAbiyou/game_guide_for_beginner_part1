  .nav-btn { padding: 10px 20px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); font-size: 14px; cursor: pointer; color: var(--color-text-primary); font-weight: 500; }

  .ui-mock { background: #2C2C2A; border-radius: var(--border-radius-md); padding: 12px; color: #D3D1C7; font-size: 12px; font-family: var(--font-mono); margin: 10px 0; }
  .ui-mock .mock-title { color: #9FE1CB; margin-bottom: 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }

  .feature-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
  .feature-card { background: var(--color-background-secondary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); padding: 10px 12px; font-size: 13px; }

  .step-nav { display: flex; gap: 6px; margin-bottom: 1rem; flex-wrap: wrap; }
  .step-pill { padding: 5px 12px; border-radius: 20px; border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); font-size: 12px; cursor: pointer; color: var(--color-text-secondary); transition: all 0.15s; }

  .explain { font-size: 13px; color: var(--color-text-secondary); line-height: 1.7; margin: 8px 0; }
  .bold { font-weight: 500; color: var(--color-text-primary); }
</style>

let currentGame = 'install';
let currentSteps = {};

function switchGame(gameId) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.step-container').forEach(c => c.classList.remove('active'));
  
  event.target.classList.add('active');
  document.getElementById('game-' + gameId).classList.add('active');
  currentGame = gameId;
  
  if (!currentSteps[gameId]) currentSteps[gameId] = 0;
  renderGame(gameId);
}

function renderGame(gameId) {
  const g = games[gameId];
  const stepIndex = currentSteps[gameId] || 0;
  const step = g.steps[stepIndex];
  const container = document.getElementById(gameId + '-steps');

  let progressHTML = '<div class="progress-bar">';
  g.steps.forEach((s, i) => {
    const cls = i < stepIndex ? 'done' : i === stepIndex ? 'current' : '';
    progressHTML += `<div class="progress-step ${cls}" onclick="goToStep('${gameId}', ${i})">
      <div class="dot">${i < stepIndex ? '✓' : i+1}</div>
    </div>`;
    if (i < g.steps.length - 1) progressHTML += '<span class="progress-arrow">›</span>';
  });
  progressHTML += '</div>';

  let badgeHTML = '';
  if (g.badge === 'easy') badgeHTML = '<span class="badge badge-easy">Facile</span>';
  if (g.badge === 'medium') badgeHTML = '<span class="badge badge-medium">Intermédiaire</span>';

  const navPrev = stepIndex > 0 ? `<button class="nav-btn" onclick="goToStep('${gameId}', ${stepIndex-1})">← Précédent</button>` : '<span></span>';
  const navNext = stepIndex < g.steps.length - 1 
    ? `<button class="nav-btn primary" onclick="goToStep('${gameId}', ${stepIndex+1})">Suivant →</button>`
    : `<button class="nav-btn primary" onclick="sendPrompt('Je veux aller plus loin avec ${gameId === 'flappy' ? 'Flappy Bird' : gameId === 'snake' ? 'Snake' : 'Bounce'} dans Unity, que puis-je ajouter comme fonctionnalités supplémentaires ?')">Aller plus loin ↗</button>`;

  container.innerHTML = `
    ${progressHTML}
    <div class="step-card">
      <div class="step-header">
        <div class="step-num">${step.num}</div>
        <div>
          <div class="step-title">${step.title} ${badgeHTML}</div>
          <div class="step-subtitle">${step.subtitle}</div>
        </div>
      </div>
      ${step.content}
    </div>
    <div class="nav-btns">${navPrev}${navNext}</div>
    <p style="text-align:center;font-size:12px;color:var(--color-text-secondary);margin-top:8px;">Étape ${stepIndex+1} sur ${g.steps.length}</p>
  `;
}

function goToStep(gameId, index) {
  currentSteps[gameId] = index;
  renderGame(gameId);
}

// Initial render
renderGame('install');
</script>
